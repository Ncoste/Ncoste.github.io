<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Lift Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a;
  --text:#f2f3f5; --muted:#8b919f; --accent:#c9f23c; --accent-ink:#0f1115;
  --danger:#ff5d5d; --ok:#4ade80;
  --r:16px; --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{resize:none;min-height:80px}
.num{font-variant-numeric:tabular-nums}

.app{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:44px}
.topbar h1{font-size:28px;margin:0;letter-spacing:-.02em;font-weight:700}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .d{font-size:22px;font-weight:700;letter-spacing:-.02em;min-width:150px;text-align:center}
.datenav .sub{font-size:12px;color:var(--muted);text-align:center;display:block;font-weight:500;letter-spacing:0}
.icon{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--text);background:var(--card)}
.icon.sm{width:32px;height:32px;font-size:16px;background:transparent;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.section{margin:18px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.section h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.section .meta{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--card2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted)}
.last{font-size:13px;color:var(--muted);margin:8px 0 10px;padding:8px 10px;background:var(--card2);border-radius:10px}
.last b{color:var(--text);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:15px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:rgba(255,93,93,.3)}
.btn.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted);padding:11px;font-weight:600}
.btn+.btn{margin-top:8px}
.btnrow{display:flex;gap:8px;margin-top:8px}
.btnrow .btn{margin:0}

.sets{display:grid;gap:6px;margin-top:4px}
.set-row{display:grid;grid-template-columns:40px 1fr 1fr 32px;gap:8px;align-items:center}
.set-row.head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 4px}
.set-row.head span:nth-child(2),.set-row.head span:nth-child(3){text-align:center}
.set-row input{text-align:center;padding:10px 6px;font-size:18px;font-weight:600;border-radius:10px}
.setnum{width:40px;height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:700;color:var(--muted);font-size:14px}
.setnum.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.bar{height:8px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.full i{background:var(--ok)}
.big{font-size:26px;font-weight:800;letter-spacing:-.03em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px}
.monthhead{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.exrow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.grouphead{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 2px}
.cardio-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.cardio-row:last-child{border-bottom:0}

.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(15,17,21,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;border-top:1px solid var(--line)}
.sheet .handle{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:20px;letter-spacing:-.02em}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--card2)}
.photo-box{margin-bottom:14px}
.photo-box img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block;background:var(--card2)}
.photo-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.datenav{border-radius:12px;padding:4px 8px}
.datenav:active{background:var(--card)}
.planned{color:var(--accent)}
.pickrow .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
.pickrow .check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pickrow.dim{opacity:.45}
.sticky-foot{position:sticky;bottom:-16px;margin:12px -16px -16px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.sticky-foot .btn:disabled{opacity:.4}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid.head span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-day{position:relative;aspect-ratio:1;border-radius:12px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;background:var(--card)}
.cal-day.today{color:var(--accent);font-weight:800}
.cal-day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal-day i{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%}
.cal-day i.dot{background:var(--accent)}
.cal-day i.dot.planned{background:transparent;border:1.5px solid var(--accent)}
i.legend{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);vertical-align:middle}
i.legend.planned{background:transparent;border:1.5px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;max-width:90vw;align-items:center;gap:12px}
.toast.show{display:flex}
.toast button{color:var(--accent);font-weight:800}
.kbd-space{height:40vh}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabs" id="tabs">
  <button class="tab" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</button>
  <button class="tab" data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5M12 7v5l3 2"/></svg>History</button>
  <button class="tab" data-act="tab" data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M6 9v6M18 9v6M3 10v4M21 10v4M6 12h12"/><rect x="6" y="8" width="2.5" height="8" rx="1"/><rect x="15.5" y="8" width="2.5" height="8" rx="1"/></svg>Exercises</button>
  <button class="tab" data-act="tab" data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<input type="file" id="photoFile" accept="image/*" style="display:none">

<script>
/* ============================================================
   Lift Log — personal resistance-training logger
   All data lives in localStorage on this device.
   ============================================================ */
const APP_VERSION = '0.3.1';
const KEY = 'liftlog.v1';
const MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Forearms','Quads','Hamstrings','Glutes','Calves','Core','Full body','Other'];

/* ---------- dates ---------- */
const z = n => String(n).padStart(2,'0');
const localISO = d => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const todayStr = () => localISO(new Date());
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return localISO(d); }
function fmtDate(s, opts){ return parseISO(s).toLocaleDateString(undefined, opts || {weekday:'short', month:'short', day:'numeric'}); }
function weekStart(s){ const d=parseISO(s); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return localISO(d); } // Monday
function relDay(s){ const t=todayStr(); if(s===t) return 'Today'; if(s===addDays(t,-1)) return 'Yesterday'; if(s===addDays(t,1)) return 'Tomorrow'; return fmtDate(s,{weekday:'long'}); }

/* ---------- state ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function fresh(){ return {version:1, settings:{unit:'lb'}, exercises:[], templates:[], days:{}, goals:[]}; }
function load(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.version===1){ return Object.assign(fresh(), s); } }catch(e){}
  return fresh();
}
let state = load();
let ui = { tab:'today', date: todayStr(), followToday:true, search:'', pick:'' };
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('Could not save — storage full?'); } }
function unit(){ return state.settings.unit || 'lb'; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const exById = id => state.exercises.find(e => e.id===id);
function day(d, create){ let x=state.days[d]; if(!x && create){ x=state.days[d]={lifts:[],cardio:[],note:''}; } return x; }
function prune(d){ const x=state.days[d]; if(x && !x.lifts.length && !x.cardio.length && !(x.note||'').trim()) delete state.days[d]; }
const filled = s => (s.w!=null && s.w!=='') || (s.r!=null && s.r!=='');
const fmtSet = s => `${s.w??'–'}×${s.r??'–'}`;
const fmtNum = n => Math.round(n).toLocaleString();

/* ---------- photos (IndexedDB, keyed by exercise id; kept out of localStorage for size) ---------- */
let photos = {};
const pdb = {
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('liftlog-photos',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async all(){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const out={}; const req=db.transaction('photos').objectStore('photos').openCursor(); req.onsuccess=()=>{ const c=req.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; req.onerror=()=>rej(req.error); }); }catch(e){ return {}; } },
  async put(id,dataUrl){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').put(dataUrl,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async del(id){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async clear(){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').clear(); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
};
async function setPhoto(id, dataUrl){ if(dataUrl){ photos[id]=dataUrl; await pdb.put(id,dataUrl).catch(()=>toast('Could not save photo')); } else { delete photos[id]; await pdb.del(id).catch(()=>{}); } }
// Shrink to max 720px on the long edge, JPEG — typically 30–60 KB.
function compressImage(file, max=720, q=0.78){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const s=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); }; img.src=url; });
}
const thumb = (id, cls='thumb') => photos[id] ? `<img class="${cls}" src="${photos[id]}" alt="">` : '';
const photoBytes = () => Object.values(photos).reduce((a,p)=>a+p.length*0.75,0);

/* ---------- queries ---------- */
function datesDesc(){ return Object.keys(state.days).sort().reverse(); }
function lastSession(exId, before){
  for(const d of datesDesc()){ if(d>=before) continue; const l=state.days[d].lifts.find(x=>x.exerciseId===exId); if(l){ const sets=l.sets.filter(filled); if(sets.length) return {date:d, sets}; } }
  return null;
}
function sessionsFor(exId){ const out=[]; for(const d of datesDesc()){ const l=state.days[d].lifts.find(x=>x.exerciseId===exId); if(l){ const sets=l.sets.filter(filled); if(sets.length) out.push({date:d,sets}); } } return out; }
function bestSet(exId, minReps){ let best=null; for(const s of sessionsFor(exId)){ for(const x of s.sets){ const w=+x.w||0, r=+x.r||0; if(minReps && r<minReps) continue; if(!best || w>best.w || (w===best.w && r>best.r)) best={w,r,date:s.date}; } } return best; }
function dayStats(d){ const x=state.days[d]; if(!x) return {ex:0,sets:0,vol:0,cardioMin:0,cardio:[]}; let sets=0,vol=0; for(const l of x.lifts){ for(const s of l.sets){ if(filled(s)){ sets++; vol+=(+s.w||0)*(+s.r||0); } } } const cardioMin=x.cardio.reduce((a,c)=>a+(+c.minutes||0),0); return {ex:x.lifts.length,sets,vol,cardioMin,cardio:x.cardio}; }
function weekStats(anchor){ const ws=weekStart(anchor); let sessions=0,sets=0,vol=0,cardioMin=0; for(let i=0;i<7;i++){ const s=dayStats(addDays(ws,i)); if(s.sets) sessions++; sets+=s.sets; vol+=s.vol; cardioMin+=s.cardioMin; } return {sessions,sets,vol,cardioMin}; }
function goalProgress(g){
  if(g.type==='lift'){ const b=bestSet(g.exerciseId, g.reps); const p=b? Math.min(1,b.w/g.weight):0; return {p, detail: b? `Best so far: ${b.w}×${b.r} on ${fmtDate(b.date)}` : 'No qualifying sets yet'}; }
  if(g.type==='sessions'){ const w=weekStats(todayStr()); return {p:Math.min(1,w.sessions/g.perWeek), detail:`${w.sessions} of ${g.perWeek} this week`}; }
  if(g.type==='cardio'){ const w=weekStats(todayStr()); return {p:Math.min(1,w.cardioMin/g.minutes), detail:`${w.cardioMin} of ${g.minutes} min this week`}; }
  return {p:0,detail:''};
}
function goalTitle(g){
  if(g.type==='lift'){ const e=exById(g.exerciseId); return `${e?e.name:'Deleted exercise'} ${g.weight} ${unit()} × ${g.reps}`; }
  if(g.type==='sessions') return `${g.perWeek} lifting sessions / week`;
  if(g.type==='cardio') return `${g.minutes} min cardio / week`;
  return 'Goal';
}

/* ---------- render ---------- */
const $ = s => document.querySelector(s);
function render(top){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab===ui.tab));
  const app=$('#app');
  const y=window.scrollY;
  app.innerHTML = {today:renderToday, history:renderHistory, exercises:renderExercises, goals:renderGoals}[ui.tab]();
  if(top) window.scrollTo(0,0); else window.scrollTo(0,y);
}

function renderToday(){
  const d=ui.date, x=state.days[d]||{lifts:[],cardio:[],note:''}, st=dayStats(d), isToday=d===todayStr();
  let h = `<div class="topbar">
    <button class="icon" data-act="prevDay">‹</button>
    <button class="datenav" data-act="openCalendar"><div><div class="d">${relDay(d)}<span class="sub">${fmtDate(d,{month:'long',day:'numeric',year:'numeric'})} ▾</span></div></div></button>
    <button class="icon" data-act="nextDay">›</button>
  </div>
  <div class="row" style="margin-bottom:6px"><div class="chips">${isToday?'':'<button class="chip accent" data-act="goToday">Jump to today</button>'}</div><button class="icon sm" data-act="settings" title="Settings">⚙︎</button></div>`;

  const planned = x.lifts.length && !st.sets;
  h += `<div class="section"><h2>Workout</h2><span class="meta">${st.sets? `${st.sets} sets · ${fmtNum(st.vol)} ${unit()}` : planned ? `<span class="planned">Planned · ${x.lifts.length} exercise${x.lifts.length!==1?'s':''}</span>` : ''}</span></div>`;
  if(!x.lifts.length){
    h += `<div class="card"><div class="empty"><b>Nothing planned yet</b>Pick the exercises for this day${state.templates.length?', or start from a template':''}, then fill in sets as you go.</div>`;
    if(state.templates.length){ h += `<div class="chips" style="justify-content:center;margin-bottom:12px">${state.templates.map(t=>`<button class="chip" data-act="applyTemplate" data-id="${t.id}">${esc(t.name)}</button>`).join('')}</div>`; }
    h += `<button class="btn primary" data-act="addExercise">+ Plan workout</button></div>`;
  } else {
    x.lifts.forEach((l,li) => {
      const e=exById(l.exerciseId); const last=lastSession(l.exerciseId, d);
      h += `<div class="card">
        <div class="row"><div class="row" style="justify-content:flex-start" data-act="openExercise" data-id="${l.exerciseId}">${e?thumb(e.id):''}<div><div class="title">${esc(e?e.name:'Deleted exercise')}</div><div class="sub">${esc([e?.muscle,e?.equipment].filter(Boolean).join(' · '))}</div></div></div>
        <button class="icon sm" data-act="removeLift" data-li="${li}">✕</button></div>
        ${last? `<div class="last">Last time <b>${fmtDate(last.date)}</b>: ${last.sets.map(fmtSet).join(' · ')}</div>` : `<div class="last">First time logging this one.</div>`}
        <div class="sets"><div class="set-row head"><span>Set</span><span>${unit()}</span><span>Reps</span><span></span></div>`;
      l.sets.forEach((s,si) => {
        h += `<div class="set-row">
          <button class="setnum ${s.done?'done':''}" data-act="toggleDone" data-li="${li}" data-si="${si}">${s.done?'✓':si+1}</button>
          <input class="num" type="number" inputmode="decimal" step="any" placeholder="${last&&last.sets[si]?last.sets[si].w:'–'}" value="${s.w??''}" data-bind="set" data-li="${li}" data-si="${si}" data-f="w">
          <input class="num" type="number" inputmode="numeric" placeholder="${last&&last.sets[si]?last.sets[si].r:'–'}" value="${s.r??''}" data-bind="set" data-li="${li}" data-si="${si}" data-f="r">
          <button class="icon sm" data-act="delSet" data-li="${li}" data-si="${si}">✕</button></div>`;
      });
      h += `</div><button class="btn ghost" style="margin-top:10px" data-act="addSet" data-li="${li}">+ Add set</button></div>`;
    });
    h += `<button class="btn" data-act="addExercise">+ Add more exercises</button>
          <button class="btn ghost" data-act="saveTemplate">Save this workout as a template</button>`;
  }

  h += `<div class="section"><h2>Cardio</h2><span class="meta">${st.cardioMin? st.cardioMin+' min':''}</span></div><div class="card">`;
  if(x.cardio.length){ h += x.cardio.map(c => `<div class="cardio-row"><div><div class="title" style="font-size:16px">${esc(c.type)}</div><div class="sub">${c.minutes} min${c.distance?` · ${c.distance} ${c.distUnit||'mi'}`:''}${c.notes?` · ${esc(c.notes)}`:''}</div></div><button class="icon sm" data-act="delCardio" data-id="${c.id}">✕</button></div>`).join(''); }
  else h += `<div class="sub" style="padding:4px 0 10px">No cardio logged.</div>`;
  h += `<button class="btn ghost" data-act="addCardio">+ Add cardio</button></div>`;

  h += `<div class="section"><h2>Notes</h2></div><div class="card"><textarea placeholder="How did it go? Sleep, energy, pain, anything worth remembering." data-bind="note">${esc(x.note||'')}</textarea></div>`;
  h += `<div class="kbd-space"></div>`;
  return h;
}

function renderHistory(){
  const w=weekStats(todayStr());
  let h = `<div class="topbar"><h1>History</h1></div>
  <div class="section" style="margin-top:0"><h2>This week</h2><span class="meta">from ${fmtDate(weekStart(todayStr()),{month:'short',day:'numeric'})}</span></div>
  <div class="stats"><div class="stat"><div class="v">${w.sessions}</div><div class="l">Sessions</div></div><div class="stat"><div class="v">${w.sets}</div><div class="l">Sets</div></div><div class="stat"><div class="v">${w.vol>=10000? (w.vol/1000).toFixed(1)+'k':fmtNum(w.vol)}</div><div class="l">${unit()} moved</div></div><div class="stat"><div class="v">${w.cardioMin}</div><div class="l">Cardio min</div></div></div>`;
  const t=todayStr();
  const upcoming=Object.keys(state.days).sort().filter(d=>d>=t && state.days[d].lifts.length && !dayStats(d).sets);
  if(upcoming.length){
    h += `<div class="section"><h2>Planned</h2></div>` + upcoming.map(d=>`<div class="card tap" data-act="openDay" data-date="${d}"><div class="row"><div class="title">${d===t?'Today':fmtDate(d)}</div><span class="planned sub">Planned ›</span></div><div class="sub" style="margin-top:4px;color:var(--text);opacity:.8">${esc(state.days[d].lifts.map(l=>exById(l.exerciseId)?.name).filter(Boolean).join(', '))}</div></div>`).join('');
  }
  const dates=datesDesc().filter(d=>{ const s=dayStats(d); return s.sets||s.cardioMin||(state.days[d].note||'').trim(); });
  if(!dates.length) return h + `<div class="card"><div class="empty"><b>No history yet</b>Logged days will show up here.</div></div>`;
  h += `<div class="section" style="margin-bottom:0"><h2>Logged</h2></div>`;
  let month='';
  for(const d of dates){
    const m=fmtDate(d,{month:'long',year:'numeric'}); if(m!==month){ month=m; h+=`<div class="monthhead">${m}</div>`; }
    const s=dayStats(d); const names=state.days[d].lifts.map(l=>exById(l.exerciseId)?.name).filter(Boolean);
    const parts=[]; if(s.sets) parts.push(`${s.ex} exercise${s.ex!==1?'s':''} · ${s.sets} sets · ${fmtNum(s.vol)} ${unit()}`); if(s.cardioMin) parts.push(s.cardio.map(c=>`${c.type} ${c.minutes} min`).join(', '));
    h += `<div class="card tap" data-act="openDay" data-date="${d}"><div class="row"><div class="title">${fmtDate(d,{weekday:'short',month:'short',day:'numeric'})}</div><span class="sub">›</span></div>
      <div class="sub" style="margin-top:4px">${parts.join(' · ')||'Note only'}</div>${names.length?`<div class="sub" style="margin-top:4px;color:var(--text);opacity:.8">${esc(names.join(', '))}</div>`:''}</div>`;
  }
  return h;
}

function renderExercises(){
  let h = `<div class="topbar"><h1>Exercises</h1><button class="chip accent" data-act="newExercise">+ New</button></div>
  <input type="search" placeholder="Search" value="${esc(ui.search)}" data-bind="search" style="margin-bottom:6px">`;
  const list=state.exercises.filter(e=>!ui.search || e.name.toLowerCase().includes(ui.search.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
  if(!state.exercises.length) return h + `<div class="card"><div class="empty"><b>No exercises yet</b>Create the movements you actually do — Bench Press, RDL, whatever you call them.</div><button class="btn primary" data-act="newExercise">+ Create your first exercise</button></div>`;
  if(!list.length) return h + `<div class="empty">No matches.</div>`;
  const groups={}; for(const e of list){ (groups[e.muscle||'Other'] ||= []).push(e); }
  for(const g of Object.keys(groups).sort((a,b)=>MUSCLES.indexOf(a)-MUSCLES.indexOf(b))){
    h += `<div class="grouphead">${esc(g)}</div><div class="card" style="padding:2px 14px">`;
    for(const e of groups[g]){ const b=bestSet(e.id); const n=sessionsFor(e.id).length; h += `<div class="exrow" data-act="openExercise" data-id="${e.id}"><div class="row" style="justify-content:flex-start">${thumb(e.id)}<div><div class="title" style="font-size:16px">${esc(e.name)}</div><div class="sub">${esc(e.equipment||'')}${e.equipment&&n?' · ':''}${n?`${n} session${n!==1?'s':''}`:''}</div></div></div><div class="sub num" style="text-align:right">${b?`<b style="color:var(--text)">${b.w}×${b.r}</b><br>best`:'—'}</div></div>`; }

  return h;
}

function renderGoals(){
  let h = `<div class="topbar"><h1>Goals</h1><button class="chip accent" data-act="newGoal">+ New</button></div>`;
  if(!state.goals.length) return h + `<div class="card"><div class="empty"><b>No goals yet</b>Set a target lift, a weekly session count, or weekly cardio minutes.</div><button class="btn primary" data-act="newGoal">+ Add a goal</button></div>`;
  for(const g of state.goals){ const pr=goalProgress(g); const pct=Math.round(pr.p*100);
    h += `<div class="card"><div class="row"><div class="title">${esc(goalTitle(g))}</div><button class="icon sm" data-act="delGoal" data-id="${g.id}">✕</button></div>
      <div class="row" style="margin-top:6px"><span class="sub">${esc(pr.detail)}</span><span class="big num" style="font-size:20px;color:${pr.p>=1?'var(--ok)':'var(--text)'}">${pct}%</span></div>

function updatePickBtn(){ const b=$('#pickDone'); if(!b) return; const n=ui.picked.size; b.disabled=!n; b.textContent = n? `Add ${n} exercise${n!==1?'s':''}` : 'Select exercises'; }

function calendarSheet(month){ // month: 'YYYY-MM'
  ui.calMonth = month || ui.date.slice(0,7);
  const [y,m]=ui.calMonth.split('-').map(Number); const first=new Date(y,m-1,1); const t=todayStr();
  const daysIn=new Date(y,m,0).getDate(); const lead=(first.getDay()+6)%7; // Monday first
  const prev=localISO(new Date(y,m-2,1)).slice(0,7), next=localISO(new Date(y,m,1)).slice(0,7);
  let cells='';
  for(let i=0;i<lead;i++) cells+='<span></span>';
  for(let d=1; d<=daysIn; d++){
    const iso=`${y}-${z(m)}-${z(d)}`; const st=dayStats(iso); const x=state.days[iso];
    const logged=st.sets>0||st.cardioMin>0, planned=!logged && x && x.lifts.length>0;
    cells+=`<button class="cal-day ${iso===t?'today':''} ${iso===ui.date?'sel':''}" data-act="calPick" data-date="${iso}">${d}<i class="${logged?'dot':planned?'dot planned':''}"></i></button>`;
  }
  openSheet(`<div class="row" style="margin-bottom:8px"><button class="icon" data-act="calMonth" data-m="${prev}">‹</button><h3 style="margin:0">${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><button class="icon" data-act="calMonth" data-m="${next}">›</button></div>
    <div class="cal-grid head">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="row" style="margin-top:14px"><span class="sub"><i class="legend"></i> logged &nbsp; <i class="legend planned"></i> planned</span><button class="chip" data-act="calPick" data-date="${t}">Today</button></div>`);
}

/* ---------- actions ---------- */
const act = {
  tab(el){ if(ui.tab===el.dataset.tab){ window.scrollTo({top:0,behavior:'smooth'}); return; } ui.tab=el.dataset.tab; render(true); },
  prevDay(){ ui.date=addDays(ui.date,-1); ui.followToday=false; render(true); },
  nextDay(){ ui.date=addDays(ui.date,1); ui.followToday=false; render(true); },
  goToday(){ ui.date=todayStr(); ui.followToday=true; render(true); },
  openDay(el){ ui.date=el.dataset.date; ui.followToday=ui.date===todayStr(); ui.tab='today'; render(true); },
  settings(){ settingsSheet(); },
  addExercise(){ pickerSheet(); },
  newExercise(){ exerciseSheet(null); },
  openExercise(el){ exerciseSheet(exById(el.dataset.id)); },
  togglePick(el){ const id=el.dataset.id; ui.picked.has(id)? ui.picked.delete(id) : ui.picked.add(id); renderPickList(); },
  pickDone(){ let n=0; for(const id of ui.picked){ if(addLift(id, true)) n++; } closeSheet(); render(); if(n) toast(`Added ${n} exercise${n!==1?'s':''}`); },
  pickPhoto(){ $('#photoFile').click(); },
  async removePhoto(){ if(ui.editingId){ await setPhoto(ui.editingId,null); } ui.pendingPhoto=null; const b=$('#photoBox'); if(b) b.outerHTML=photoBox(null); },
  openCalendar(){ calendarSheet(); },
  calMonth(el){ calendarSheet(el.dataset.m); },
  calPick(el){ ui.date=el.dataset.date; ui.followToday=ui.date===todayStr(); closeSheet(); render(true); },
  addSet(el){ const l=day(ui.date).lifts[+el.dataset.li]; const prev=l.sets[l.sets.length-1]; const last=lastSession(l.exerciseId, ui.date); const ref=last?.sets[l.sets.length];
    l.sets.push({w: prev? prev.w : (ref?ref.w:null), r: prev? prev.r : (ref?ref.r:null)}); save(); render(); },
  delSet(el){ const l=day(ui.date).lifts[+el.dataset.li]; l.sets.splice(+el.dataset.si,1); save(); render(); },
  toggleDone(el){ const s=day(ui.date).lifts[+el.dataset.li].sets[+el.dataset.si]; s.done=!s.done; save(); render(); },
  removeLift(el){ const x=day(ui.date); const l=x.lifts[+el.dataset.li]; const e=exById(l.exerciseId); if(l.sets.some(filled) && !confirm(`Remove ${e?e.name:'this exercise'} and its sets from this day?`)) return; x.lifts.splice(+el.dataset.li,1); prune(ui.date); save(); render(); },
  saveTemplate(){ templateSheet(); },
  applyTemplate(el){ const t=state.templates.find(t=>t.id===el.dataset.id); if(!t) return; for(const id of t.exerciseIds){ if(exById(id)) addLift(id); } render(); toast(`Started “${t.name}”`); },
  deleteTemplate(el){ if(!confirm('Delete this template?')) return; state.templates=state.templates.filter(t=>t.id!==el.dataset.id); save(); templateSheet(); },
  addCardio(){ cardioSheet(); },
  fillCardioType(el){ const i=$('#sheet input[name=type]'); if(i) i.value=el.dataset.v; },
  delCardio(el){ const x=day(ui.date); x.cardio=x.cardio.filter(c=>c.id!==el.dataset.id); prune(ui.date); save(); render(); },
  newGoal(){ goalSheet(); },
  delGoal(el){ if(!confirm('Delete this goal?')) return; state.goals=state.goals.filter(g=>g.id!==el.dataset.id); save(); render(); },
  deleteExercise(el){ const id=el.dataset.id; const n=datesDesc().filter(d=>state.days[d].lifts.some(l=>l.exerciseId===id)).length;
    if(!confirm(n?`This exercise is logged on ${n} day${n!==1?'s':''}. Deleting it removes those logs too. Delete anyway?`:'Delete this exercise?')) return;
    state.exercises=state.exercises.filter(e=>e.id!==id); for(const d of Object.keys(state.days)){ state.days[d].lifts=state.days[d].lifts.filter(l=>l.exerciseId!==id); prune(d); }
    state.templates.forEach(t=>t.exerciseIds=t.exerciseIds.filter(x=>x!==id)); state.goals=state.goals.filter(g=>g.exerciseId!==id); save(); setPhoto(id,null); closeSheet(); render(); },
  setUnit(el){ state.settings.unit=el.dataset.v; save(); settingsSheet(); render(); },
  export(){ exportData(); },
  import(){ $('#importFile').click(); },
  clearAll(){ if(!confirm('Erase ALL exercises, workouts, photos, and goals from this phone? This cannot be undone.')) return; if(!confirm('Really erase everything?')) return; state=fresh(); save(); photos={}; pdb.clear().catch(()=>{}); closeSheet(); render(); },
  closeSheet(){ closeSheet(); },
};
function addLift(exId, quiet){ const x=day(ui.date,true); if(x.lifts.some(l=>l.exerciseId===exId)){ if(!quiet) toast('Already in this workout'); prune(ui.date); return false; }
  const last=lastSession(exId, ui.date); const n=last? Math.max(1,last.sets.length) : 1;
  x.lifts.push({exerciseId:exId, sets:Array.from({length:n},(_,i)=>({w:null,r:null}))}); save(); return true; }

const forms = {
  exercise(fd, f){ const id=f.dataset.id; const name=fd.get('name').trim(); if(!name) return;
    if(id){ Object.assign(exById(id),{name,muscle:fd.get('muscle'),equipment:fd.get('equipment').trim()}); save(); closeSheet(); render(); }
    else { const e={id:uid(),name,muscle:fd.get('muscle'),equipment:fd.get('equipment').trim(),createdAt:todayStr()}; state.exercises.push(e); save();
      const p=ui.pendingPhoto; ui.pendingPhoto=undefined;
      if(ui.tab==='today'){ addLift(e.id); } closeSheet(); render(); toast(`Created ${name}`);
      if(p){ setPhoto(e.id,p).then(render); } } },
  cardio(fd){ const x=day(ui.date,true); x.cardio.push({id:uid(), type:fd.get('type').trim(), minutes:+fd.get('minutes')||0, distance:fd.get('distance')?+fd.get('distance'):null, distUnit:fd.get('distUnit'), notes:fd.get('notes').trim()}); save(); closeSheet(); render(); },
  goal(fd){ const t=fd.get('type'); const g={id:uid(),type:t,createdAt:todayStr()};
    if(t==='lift'){ g.exerciseId=fd.get('exerciseId'); g.weight=+fd.get('weight'); g.reps=+fd.get('reps'); if(!g.exerciseId||!g.weight||!g.reps) return; }
    if(t==='sessions'){ g.perWeek=+fd.get('perWeek'); if(!g.perWeek) return; }
    if(t==='cardio'){ g.minutes=+fd.get('minutes'); if(!g.minutes) return; }
    state.goals.push(g); save(); closeSheet(); render(); },
  template(fd){ const x=day(ui.date); if(!x||!x.lifts.length) return; state.templates.push({id:uid(), name:fd.get('name').trim(), exerciseIds:x.lifts.map(l=>l.exerciseId)}); save(); closeSheet(); toast('Template saved'); },
};

/* ---------- event wiring ---------- */
document.addEventListener('click', e => {
  const el=e.target.closest('[data-act]'); if(el && act[el.dataset.act]){ e.preventDefault(); act[el.dataset.act](el,e); return; }
  const seg=e.target.closest('.seg[data-seg] button'); if(seg && !seg.dataset.act){ const segEl=seg.parentElement; segEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===seg)); const hidden=segEl.parentElement.querySelector(`input[name=${segEl.dataset.seg}]`); if(hidden) hidden.value=seg.dataset.v;
    if(segEl.dataset.seg==='type'){ $('#goalFields').innerHTML=goalFields(seg.dataset.v,[...state.exercises].sort((a,b)=>a.name.localeCompare(b.name))); } }
});
document.addEventListener('submit', e => { const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault(); forms[f.dataset.form]?.(new FormData(f), f); });
document.addEventListener('input', e => {
  const el=e.target; const b=el.dataset.bind; if(!b) return;
  if(b==='set'){ const s=day(ui.date,true).lifts[+el.dataset.li]?.sets[+el.dataset.si]; if(!s) return; s[el.dataset.f]= el.value===''? null : +el.value; save(); }
  else if(b==='note'){ day(ui.date,true).note=el.value; save(); }
  else if(b==='search'){ ui.search=el.value; const v=el.value; render(); const i=$('input[data-bind=search]'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length); } }
  else if(b==='pick'){ ui.pick=el.value; renderPickList(); }
});
document.addEventListener('change', e => { if(e.target.dataset.bind==='note'){ prune(ui.date); save(); } });
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && ui.followToday && ui.date!==todayStr()){ ui.date=todayStr(); render(); } });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.matches('input[data-bind=set]')){ e.target.blur(); } });

/* ---------- backup ---------- */
function exportData(){
  const json=JSON.stringify(Object.assign({}, state, {photos}),null,2); const name=`liftlog-${todayStr()}.json`; const blob=new Blob([json],{type:'application/json'});
  try{ const file=new File([blob],name,{type:'application/json'}); if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:'Lift Log backup'}).catch(()=>{}); return; } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
$('#importFile').addEventListener('change', async e => {
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const s=JSON.parse(await f.text()); if(!s || s.version!==1 || !Array.isArray(s.exercises)) throw 0;
    const n=Object.keys(s.days||{}).length; if(!confirm(`Replace everything on this phone with this backup? (${s.exercises.length} exercises, ${n} logged days)`)) return;
    const ph=(s.photos && typeof s.photos==='object')? s.photos : {}; delete s.photos;
    state=Object.assign(fresh(), s); save(); photos={}; await pdb.clear().catch(()=>{}); for(const [id,p] of Object.entries(ph)){ if(typeof p==='string' && p.startsWith('data:image/')) await setPhoto(id,p); }
    closeSheet(); render(); toast('Backup restored'); }
  catch(err){ toast('That file is not a Lift Log backup'); }
});
$('#photoFile').addEventListener('change', async e => {
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const data=await compressImage(f);
    if(ui.editingId){ await setPhoto(ui.editingId,data); } else { ui.pendingPhoto=data; }
    const b=$('#photoBox'); if(b) b.outerHTML=photoBox(data); if(ui.editingId) render(); }
  catch(err){ toast('Could not read that image'); }
});

/* ---------- misc ---------- */
let toastT; function toast(msg, action){ const t=$('#toast'); t.innerHTML=esc(msg)+(action?`<button id="toastBtn">${esc(action.label)}</button>`:''); t.classList.add('show'); clearTimeout(toastT); if(action){ $('#toastBtn').onclick=action.fn; } else toastT=setTimeout(()=>t.classList.remove('show'),2200); }

if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const nw=reg.installing; nw && nw.addEventListener('statechange', () => { if(nw.state==='installed' && navigator.serviceWorker.controller){ toast('Update ready', {label:'Reload', fn:()=>{ nw.postMessage('skipWaiting'); }}); } }); });
  }).catch(()=>{});
  let refreshing=false; navigator.serviceWorker.addEventListener('controllerchange', () => { if(refreshing) return; refreshing=true; location.reload(); });
}
render();
pdb.all().then(p => { photos=p; if(Object.keys(p).length) render(); });
</script>
</body>
</html>
